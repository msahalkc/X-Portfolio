# Pages are pre-rendered at build time (scripts/prerender.mjs):
#   /            -> index.html
#   /asset-build -> asset-build.html
#   /extend      -> extend.html
# Any other path gets 404.html with a real 404 status (Netlify does this by default).

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# Vite gives these files content-hashed names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
